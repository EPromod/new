<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Editor - Edy Sahputra</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --app-height: 100dvh; --editor-bg: #1e1e1e; --accent: #10b981; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #d4d4d4; 
            height: var(--app-height); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            user-select: none; /* Anti-maling: Teks tidak bisa diseleksi di luar editor */
        }
        
        header { height: 48px; background: #252526; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Editor Style */
        .editor-wrapper { display: flex; height: 100%; width: 100%; overflow: hidden; background: var(--editor-bg); position: relative; }
        .gutter { width: 35px; background: #252526; color: #666; text-align: right; padding-top: 15px; padding-right: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; user-select: none; border-right: 1px solid #333; }
        textarea { flex: 1; resize: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: transparent; color: #e0e0e0; border: none; outline: none; padding: 15px 10px; line-height: 1.5; tab-size: 2; user-select: text; }

        /* Protection Overlay */
        #lock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.1); z-index: 10; display: none; cursor: not-allowed; }

        /* Tabs */
        .tab-bar { display: flex; background: #252526; border-bottom: 1px solid #1a1a1a; }
        .tab { padding: 8px 12px; display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; border-right: 1px solid #1a1a1a; cursor: pointer; }
        .tab.active { background: #1e1e1e; color: #fff; border-bottom: 2px solid var(--accent); }

        .icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #ccc; }
        .icon-btn.active { color: var(--accent); }
        .icon-btn.run { background: var(--accent); color: white; width: 40px; margin-left: 5px; }

        footer { height: 22px; background: #007acc; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 10px; font-weight: 500; }

        .hidden-panel { display: none !important; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Anti-maling: Klik Kanan Mati -->

    <!-- HEADER -->
    <header>
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-shield-checkered text-green-500 text-xl"></i>
            <input type="text" id="proj-name" value="MySecureProject" class="bg-transparent border-none outline-none text-[11px] font-bold w-24 text-gray-400 focus:text-white">
        </div>

        <div class="flex items-center gap-0.5">
            <button onclick="toggleLock()" id="lock-btn" class="icon-btn" title="Kunci Editor"><i class="ph ph-lock-key-open text-lg"></i></button>
            <button onclick="saveToLocal()" class="icon-btn"><i class="ph ph-floppy-disk text-lg"></i></button>
            <button onclick="copyToClipboard()" class="icon-btn"><i class="ph ph-copy text-lg"></i></button>
            <button onclick="downloadCode()" class="icon-btn"><i class="ph ph-download-simple text-lg"></i></button>
            <button onclick="resetEditor()" class="icon-btn"><i class="ph ph-trash text-lg"></i></button>
            <button onclick="forceRun()" class="icon-btn run shadow-lg"><i class="ph-fill ph-play text-lg"></i></button>
        </div>
    </header>

    <div class="main-container">
        <!-- EDITOR -->
        <div id="editor-side" class="w-full md:w-1/2 flex flex-col border-r border-[#333]">
            <div class="tab-bar">
                <div class="tab active" data-lang="html"><i class="ph-fill ph-file-html text-orange-500"></i> HTML</div>
                <div class="tab" data-lang="css"><i class="ph-fill ph-file-css text-blue-400"></i> CSS</div>
                <div class="tab" data-lang="js"><i class="ph-fill ph-file-js text-yellow-400"></i> JS</div>
                <div class="ml-auto flex items-center pr-2">
                    <i class="ph ph-info text-gray-500 cursor-pointer" onclick="alert('Pro Editor v2.5\nAnti-Theft Active')"></i>
                </div>
            </div>

            <div class="flex-1 relative overflow-hidden bg-[#1e1e1e]">
                <div id="lock-overlay"></div> <!-- Pelindung Edit -->
                <div id="html-panel" class="editor-wrapper">
                    <div id="html-gutter" class="gutter"></div>
                    <textarea id="html-code" spellcheck="false" placeholder="Tulis HTML..."></textarea>
                </div>
                <div id="css-panel" class="editor-wrapper hidden-panel">
                    <div id="css-gutter" class="gutter"></div>
                    <textarea id="css-code" spellcheck="false" placeholder="Tulis CSS..."></textarea>
                </div>
                <div id="js-panel" class="editor-wrapper hidden-panel">
                    <div id="js-gutter" class="gutter"></div>
                    <textarea id="js-code" spellcheck="false" placeholder="Tulis JS..."></textarea>
                </div>
            </div>
        </div>

        <!-- PREVIEW -->
        <div id="preview-side" class="hidden md:flex w-full md:w-1/2 flex-col bg-white relative">
            <div class="h-7 bg-[#f0f0f0] border-b flex items-center px-3 justify-between">
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Secure Preview Area</span>
                <div class="flex md:hidden bg-gray-200 rounded px-2" onclick="toggleMobileView('editor')">
                    <span class="text-[9px] font-bold">KEMBALI KE KODE</span>
                </div>
            </div>
            <iframe id="output" class="w-full h-full border-none bg-white"></iframe>
            <div id="error-console" class="absolute bottom-0 w-full bg-red-900 text-white text-[10px] p-2 hidden"></div>
        </div>
    </div>

    <!-- FOOTER (Identitas Pencipta) -->
    <footer>
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-cpu"></i>
            <span>System Ready</span>
        </div>
        <div class="flex items-center gap-1">
            <span class="opacity-70">Created by</span>
            <span class="font-bold tracking-wide">Edy Sahputra</span>
        </div>
        <div class="hidden sm:block">
            <span id="char-count">Lines: 0</span>
        </div>
    </footer>

    <script>
        // --- SECURITY LOGIC (Anti-Maling) ---
        document.onkeydown = function(e) {
            // Blokir F12
            if(e.keyCode == 123) return false;
            // Blokir Ctrl+Shift+I (Inspect)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            // Blokir Ctrl+U (View Source)
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            // Blokir Ctrl+S (Save)
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
                e.preventDefault();
                saveToLocal();
                return false;
            }
        };

        let isLocked = false;
        function toggleLock() {
            isLocked = !isLocked;
            const overlay = document.getElementById('lock-overlay');
            const btn = document.getElementById('lock-btn');
            if(isLocked) {
                overlay.style.display = 'block';
                btn.innerHTML = '<i class="ph ph-lock-key text-red-500 text-lg"></i>';
                btn.classList.add('active');
            } else {
                overlay.style.display = 'none';
                btn.innerHTML = '<i class="ph ph-lock-key-open text-lg"></i>';
                btn.classList.remove('active');
            }
        }

        // --- EDITOR LOGIC ---
        const editors = {
            html: { area: document.getElementById('html-code'), gutter: document.getElementById('html-gutter'), panel: document.getElementById('html-panel') },
            css: { area: document.getElementById('css-code'), gutter: document.getElementById('css-gutter'), panel: document.getElementById('css-panel') },
            js: { area: document.getElementById('js-code'), gutter: document.getElementById('js-gutter'), panel: document.getElementById('js-panel') }
        };

        function updateGutter(lang) {
            const lines = editors[lang].area.value.split('\n').length;
            editors[lang].gutter.innerHTML = Array(lines).fill(0).map((_, i) => `<div>${i + 1}</div>`).join('');
            document.getElementById('char-count').textContent = `Lines: ${lines}`;
        }

        function compile() {
            const html = editors.html.area.value;
            const css = `<style>${editors.css.area.value}</style>`;
            const js = `<script>
                try {
                    window.onerror = (m, s, l) => window.parent.postMessage({m, l:l-1}, '*');
                    ${editors.js.area.value}
                } catch(e) { console.error(e); }
            <\/script>`;
            
            // Tambahkan Watermark pada Output Preview
            const watermarkStyle = `<style>.edy-watermark{position:fixed;bottom:10px;right:10px;font-family:sans-serif;font-size:10px;color:rgba(0,0,0,0.2);pointer-events:none;z-index:9999;}</style>`;
            const watermarkHTML = `<div class="edy-watermark text-gray-400">Preview by Edy Sahputra</div>`;

            const fullCode = `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">${css}${watermarkStyle}</head><body>${html}${watermarkHTML}${js}</body></html>`;
            
            const blob = new Blob([fullCode], {type: 'text/html'});
            document.getElementById('output').src = URL.createObjectURL(blob);
        }

        // Tab Switch
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                Object.keys(editors).forEach(k => editors[k].panel.classList.add('hidden-panel'));
                editors[tab.dataset.lang].panel.classList.remove('hidden-panel');
                updateGutter(tab.dataset.lang);
            });
        });

        Object.keys(editors).forEach(lang => {
            editors[lang].area.addEventListener('input', () => {
                updateGutter(lang);
                clearTimeout(this.timer);
                this.timer = setTimeout(compile, 1000);
            });
            editors[lang].area.addEventListener('scroll', () => {
                editors[lang].gutter.scrollTop = editors[lang].area.scrollTop;
            });
        });

        function forceRun() {
            compile();
            if(window.innerWidth < 768) {
                document.getElementById('editor-side').classList.add('hidden');
                document.getElementById('preview-side').classList.remove('hidden');
                document.getElementById('preview-side').classList.add('flex');
            }
        }

        function toggleMobileView(view) {
            document.getElementById('editor-side').classList.remove('hidden');
            document.getElementById('preview-side').classList.add('hidden');
        }

        function saveToLocal() {
            const data = { h: editors.html.area.value, c: editors.css.area.value, j: editors.js.area.value, n: document.getElementById('proj-name').value };
            localStorage.setItem('edy_editor_data', JSON.stringify(data));
            alert("Project Aman & Tersimpan!");
        }

        function copyToClipboard() {
            const val = `<!-- Project: ${document.getElementById('proj-name').value} -->\n<!-- Created by Edy Sahputra -->\n\n` + 
                        editors.html.area.value + "\n\n" + editors.css.area.value + "\n\n" + editors.js.area.value;
            navigator.clipboard.writeText(val);
            alert("Kode disalin ke clipboard!");
        }

        function downloadCode() {
            const code = `<!DOCTYPE html>\n<!-- Created by Edy Sahputra -->\n<html><head><style>${editors.css.area.value}</style></head><body>${editors.html.area.value}<script>${editors.js.area.value}<\/script></body></html>`;
            const a = document.createElement('a');
            a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
            a.download = document.getElementById('proj-name').value + ".html";
            a.click();
        }

        function resetEditor() {
            if(confirm("Hapus semua kode?")) {
                editors.html.area.value = ""; editors.css.area.value = ""; editors.js.area.value = "";
                updateGutter('html'); compile();
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('edy_editor_data');
            if(saved) {
                const d = JSON.parse(saved);
                editors.html.area.value = d.h; editors.css.area.value = d.c; editors.js.area.value = d.j;
                document.getElementById('proj-name').value = d.n || "MySecureProject";
            } else {
                editors.html.area.value = "<h1>Pro Editor</h1>\n<p>By Edy Sahputra</p>";
                editors.css.area.value = "body { background: #121212; color: #007acc; text-align: center; padding-top: 50px; }";
            }
            updateGutter('html'); updateGutter('css'); updateGutter('js');
            compile();
        }
    </script>
</body>
</html>
